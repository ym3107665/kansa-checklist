<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>就職イベント2026 ブース記録帳</title>
<style>
  :root{
    --paper:#EDEAE2;
    --paper-card:#FBFAF6;
    --ink:#232620;
    --ink-soft:#6B6A60;
    --hairline:rgba(35,38,32,0.14);
    --stamp-red:#B23A2E;
    --area-a:#2F5AA6; /* 青 */
    --area-b:#3F7D53; /* 緑 */
    --area-c:#C7862A; /* 黄・橙 */
    --area-d:#B23A2E; /* 赤 */
    --star:#C7862A;
    --star-off:#D8D4C8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(35,38,32,0.035) 1px, transparent 0);
    background-size:14px 14px;
    color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
    line-height:1.6;
    padding:0 0 80px;
  }
  .serif{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;}

  /* ---------- header ---------- */
  header{
    padding:36px 20px 22px;
    max-width:920px;
    margin:0 auto;
    border-bottom:1px solid var(--hairline);
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:0.22em;
    color:var(--ink-soft);
    margin:0 0 8px;
  }
  h1{
    font-size:26px;
    margin:0 0 6px;
    font-weight:700;
    letter-spacing:0.02em;
  }
  .lead{
    font-size:13.5px;
    color:var(--ink-soft);
    margin:0 0 22px;
    max-width:56ch;
  }
  .stats{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .stat-pill{
    background:var(--paper-card);
    border:1px solid var(--hairline);
    border-radius:3px;
    padding:9px 14px;
    font-size:12.5px;
    display:flex;
    align-items:baseline;
    gap:6px;
  }
  .stat-pill b{font-size:16px;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;}
  .stat-pill .area-dot{
    width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:2px;
  }

  .backup-row{
    display:flex;
    gap:10px;
    margin-top:16px;
    flex-wrap:wrap;
    align-items:center;
  }
  .backup-btn{
    border:1px solid var(--hairline);
    background:var(--paper-card);
    color:var(--ink);
    font-size:12px;
    padding:8px 14px;
    border-radius:3px;
    cursor:pointer;
    font-family:inherit;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .backup-btn:hover{border-color:var(--ink);}
  .backup-msg{
    font-size:11.5px;
    color:var(--ink-soft);
  }
  .backup-msg.error{color:var(--stamp-red);}

  .priority-row{
    display:flex;
    gap:6px;
    margin-top:10px;
  }
  .priority-btn{
    border:1px solid var(--hairline);
    background:transparent;
    color:var(--ink-soft);
    font-size:11px;
    padding:5px 10px;
    border-radius:20px;
    cursor:pointer;
    font-family:inherit;
  }
  .priority-btn[data-priority="main"].active{
    background:var(--area-color);
    border-color:var(--area-color);
    color:#fff;
  }
  .priority-btn[data-priority="optional"].active{
    background:transparent;
    border-color:var(--ink-soft);
    border-style:dashed;
    color:var(--ink);
  }
  .priority-flag{
    position:absolute;
    top:-9px;
    right:14px;
    font-size:10px;
    padding:2px 8px;
    border-radius:10px;
    letter-spacing:0.05em;
  }
  .priority-flag.main{background:var(--area-color);color:#fff;}
  .priority-flag.optional{background:transparent;border:1px dashed var(--ink-soft);color:var(--ink-soft);}

  .filters{
    max-width:920px;
    margin:18px auto 0;
    padding:0 20px;
    display:flex;
    gap:8px;
  }
  .filter-btn{
    border:1px solid var(--hairline);
    background:var(--paper-card);
    color:var(--ink-soft);
    font-size:12px;
    padding:7px 13px;
    border-radius:20px;
    cursor:pointer;
    font-family:inherit;
  }
  .filter-btn.active{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
  }

  /* ---------- area sections ---------- */
  main{
    max-width:920px;
    margin:0 auto;
    padding:8px 20px 0;
  }
  .area-section{margin-top:38px;}
  .area-head{
    display:flex;
    align-items:baseline;
    gap:12px;
    margin-bottom:4px;
    padding-bottom:10px;
    border-bottom:2px solid var(--area-color);
  }
  .area-letter{
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:30px;
    font-weight:700;
    color:var(--area-color);
    line-height:1;
  }
  .area-titles{flex:1;}
  .area-name{font-size:15px;font-weight:700;}
  .area-target{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .area-progress{font-size:12px;color:var(--ink-soft);white-space:nowrap;}

  .tier-group{margin-top:18px;}
  .tier-label{
    font-size:11px;
    letter-spacing:0.12em;
    color:var(--area-color);
    font-weight:700;
    margin:0 0 10px 2px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .tier-label .tier-target{
    font-weight:400;
    color:var(--ink-soft);
    letter-spacing:0;
  }

  .card-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:10px;
  }

  .firm-card{
    background:var(--paper-card);
    border:1px solid var(--hairline);
    border-left:3px solid var(--area-color);
    border-radius:2px;
    padding:14px 16px;
    display:grid;
    grid-template-columns:1fr auto;
    gap:10px 16px;
    align-items:start;
    position:relative;
    transition:opacity .2s;
  }
  .firm-card.core-tag::before{
    content:"基本軸";
    position:absolute;
    top:-9px;
    left:14px;
    background:var(--area-color);
    color:var(--paper);
    font-size:10px;
    padding:2px 8px;
    border-radius:10px;
    letter-spacing:0.05em;
  }
  .firm-name{
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:15px;
    font-weight:700;
    margin:0 0 6px;
  }
  .firm-meta{
    font-size:11.5px;
    color:var(--ink-soft);
    margin:0 0 10px;
  }

  .stars{display:flex;gap:3px;}
  .star-btn{
    background:none;
    border:none;
    font-size:19px;
    line-height:1;
    padding:2px;
    cursor:pointer;
    color:var(--star-off);
  }
  .star-btn.filled{color:var(--star);}

  .qa-zone{margin-top:10px;}
  .qa-label{
    font-size:10.5px;
    color:var(--ink-soft);
    letter-spacing:0.04em;
    margin:0 0 5px;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
  }
  .qa-count{font-weight:700;color:var(--area-color);}
  .qa-list{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .qa-list li label{
    display:flex;
    align-items:flex-start;
    gap:7px;
    font-size:12px;
    color:var(--ink);
    cursor:pointer;
  }
  .qa-list input[type="checkbox"]{
    margin-top:2.5px;
    accent-color:var(--area-color);
    width:14px;height:14px;
    flex-shrink:0;
    cursor:pointer;
  }
  .qa-list li label.checked-q{
    color:var(--ink-soft);
    text-decoration:line-through;
    text-decoration-color:var(--hairline);
  }

  .memo-zone{margin-top:10px;}
  .memo-label{
    font-size:10.5px;
    color:var(--ink-soft);
    letter-spacing:0.04em;
    display:block;
    margin-bottom:4px;
  }
  .memo-input{
    width:100%;
    min-height:44px;
    resize:vertical;
    border:1px solid var(--hairline);
    background:#fff;
    border-radius:3px;
    padding:7px 9px;
    font-family:inherit;
    font-size:12.5px;
    color:var(--ink);
    line-height:1.5;
  }
  .memo-input:focus{
    outline:none;
    border-color:var(--area-color);
  }
  .memo-saved{
    font-size:10px;
    color:var(--ink-soft);
    opacity:0;
    transition:opacity .3s;
    margin-top:3px;
    display:inline-block;
  }
  .memo-saved.show{opacity:1;}

  .pdf-zone{margin-top:10px;}
  .pdf-add-label{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:11.5px;
    color:var(--ink-soft);
    border:1px dashed var(--hairline);
    padding:6px 11px;
    border-radius:3px;
    cursor:pointer;
  }
  .pdf-add-label:hover{border-color:var(--area-color);color:var(--area-color);}
  .pdf-add-label input{display:none;}

  .pdf-attached{
    font-size:11.5px;
  }
  .pdf-attached summary{
    cursor:pointer;
    color:var(--area-color);
    display:flex;
    align-items:center;
    gap:6px;
    list-style:none;
  }
  .pdf-attached summary::-webkit-details-marker{display:none;}
  .pdf-attached summary::before{content:"▸";transition:transform .15s;}
  .pdf-attached[open] summary::before{transform:rotate(90deg);}
  .pdf-frame-wrap{margin-top:8px;}
  .pdf-frame-wrap iframe{
    width:100%;
    height:340px;
    border:1px solid var(--hairline);
    border-radius:3px;
    background:#fff;
  }
  .pdf-remove{
    margin-left:10px;
    color:var(--stamp-red);
    background:none;border:none;cursor:pointer;font-size:11px;
    text-decoration:underline;
  }
  .pdf-loading{color:var(--ink-soft);font-style:italic;padding:8px 0;}
  .pdf-error{color:var(--stamp-red);font-size:11px;margin-top:6px;}

  /* ---------- stamp (signature element) ---------- */
  .stamp-zone{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    width:78px;
  }
  .stamp-btn{
    width:60px;height:60px;
    border-radius:50%;
    border:2px solid var(--hairline);
    background:transparent;
    cursor:pointer;
    position:relative;
    display:flex;align-items:center;justify-content:center;
    padding:0;
  }
  .stamp-mark{
    width:52px;height:52px;
    border-radius:50%;
    border:2.5px solid var(--stamp-red);
    color:var(--stamp-red);
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-weight:700;
    font-size:19px;
    display:flex;align-items:center;justify-content:center;
    transform:scale(0) rotate(-14deg);
    opacity:0;
    transition:transform .28s cubic-bezier(.34,1.56,.64,1), opacity .18s;
    background:
      radial-gradient(circle at 30% 30%, rgba(178,58,46,0.10), transparent 60%);
  }
  .stamp-btn.on .stamp-mark{
    transform:scale(1) rotate(-14deg);
    opacity:1;
  }
  .stamp-caption{font-size:10.5px;color:var(--ink-soft);}

  details.other-toggle{margin-top:16px;}
  details.other-toggle > summary{
    cursor:pointer;
    font-size:12px;
    color:var(--ink-soft);
    list-style:none;
  }
  details.other-toggle > summary::-webkit-details-marker{display:none;}
  details.other-toggle > summary::before{content:"＋ ";}
  details.other-toggle[open] > summary::before{content:"－ ";}
  details.other-toggle .card-grid{margin-top:10px;}

  .firm-card.hidden-by-filter{display:none;}

  footer{
    max-width:920px;
    margin:44px auto 0;
    padding:16px 20px 0;
    font-size:11px;
    color:var(--ink-soft);
    border-top:1px solid var(--hairline);
  }

  @media (max-width:520px){
    .firm-card{grid-template-columns:1fr;}
    .stamp-zone{flex-direction:row;width:auto;}
  }
</style>
</head>
<body>

<header>
  <p class="eyebrow">CPA会計学院主催 就職イベント2026・東京会場</p>
  <h1 class="serif">ブース記録帳</h1>
  <p class="lead">見たブースにチェック、印象を5段階で、もらった資料PDFはその場で添付。データはこの端末に保存されます。</p>
  <div class="stats" id="statsRow"></div>
  <div class="backup-row">
    <button class="backup-btn" id="exportBtn" type="button">⭳ バックアップをダウンロード</button>
    <label class="backup-btn" for="importInput">⭱ バックアップを復元
      <input type="file" id="importInput" accept="application/json" style="display:none;">
    </label>
    <span class="backup-msg" id="backupMsg"></span>
  </div>
</header>

<div class="filters">
  <button class="filter-btn active" data-filter="all">すべて</button>
  <button class="filter-btn" data-filter="unvisited">未訪問</button>
  <button class="filter-btn" data-filter="visited">訪問済み</button>
</div>

<div class="filters" style="margin-top:8px;">
  <button class="filter-btn active" data-priority-filter="all">優先度：すべて</button>
  <button class="filter-btn" data-priority-filter="main">メインのみ</button>
  <button class="filter-btn" data-priority-filter="optional">余裕があればのみ</button>
</div>

<main id="main"></main>

<footer>
  ローカル保存のみ（この端末・このブラウザ限定）。PDFは1法人あたり目安3MB程度までを推奨。
</footer>

<script>
(function(){

  // ---------------- data ----------------
  const AREAS = [
    {
      id:"A", name:"Big4", color:"var(--area-a)",
      target:"可能であれば4法人すべて",
      tiers:[
        { label:"Big4", target:"4法人", firms:[
          {id:"a-azusa", name:"有限責任 あずさ監査法人", staff:6313, listed:550},
          {id:"a-ey", name:"EY新日本有限責任監査法人", staff:5999, listed:728},
          {id:"a-pwc", name:"PwC Japan有限責任監査法人", staff:3662, listed:189},
          {id:"a-tohmatsu", name:"有限責任監査法人トーマツ", staff:6158, listed:675},
        ]}
      ]
    },
    {
      id:"B", name:"中小監査法人（本命ゾーン）", color:"var(--area-b)",
      target:"Tier3を1法人＋Tier4を3〜4法人（フリー時間もここで使用）",
      tiers:[
        { label:"Tier3（常勤60〜100名）", target:"1法人", firms:[
          {id:"b-aa", name:"監査法人A&Aパートナーズ", staff:97, listed:36},
          {id:"b-moore", name:"Mooreみらい監査法人", staff:91, listed:26},
          {id:"b-cosmos", name:"監査法人コスモス", staff:67, listed:6},
          {id:"b-friq", name:"監査法人FRIQ", staff:65, listed:15},
          {id:"b-yaesu", name:"八重洲監査法人", staff:64, listed:10},
        ]},
        { label:"Tier4（常勤30〜40名台）", target:"3〜4法人", firms:[
          {id:"b-shinso", name:"新創監査法人", staff:38, listed:8},
          {id:"b-shisai", name:"史彩監査法人", staff:35, listed:16},
          {id:"b-partners", name:"有限責任パートナーズ綜合監査法人", staff:33, listed:9},
          {id:"b-aoi", name:"あおい監査法人", staff:32, listed:9},
          {id:"b-hibiki", name:"ひびき監査法人", staff:32, listed:24},
          {id:"b-oh", name:"應和監査法人", staff:32, listed:15},
          {id:"b-seiyu", name:"清友監査法人", staff:31, listed:6},
        ]}
      ]
    },
    {
      id:"C", name:"準大手・中堅", color:"var(--area-c)",
      target:"Tier1・Tier2を最低ひとつずつ",
      tiers:[
        { label:"Tier1（準大手・常勤250名以上）", target:"最低1法人", firms:[
          {id:"c-taiyo", name:"太陽有限責任監査法人", staff:948, listed:337},
          {id:"c-gyosei", name:"仰星監査法人", staff:292, listed:110},
          {id:"c-toyo", name:"東陽監査法人", staff:268, listed:76},
          {id:"c-sanyu", name:"三優監査法人（BDO三優）", staff:338, listed:82},
        ]},
        { label:"Tier2（大型中堅・常勤100〜200名）", target:"最低1法人", firms:[
          {id:"c-avantia", name:"監査法人アヴァンティア", staff:180, listed:50},
          {id:"c-esnext", name:"ESネクスト有限責任監査法人", staff:144, listed:13},
          {id:"c-forvis", name:"Forvis Mazars Japan有限責任監査法人", staff:104, listed:14},
          {id:"c-kanade", name:"かなで監査法人", staff:133, listed:29},
        ]}
      ]
    },
    {
      id:"D", name:"税務・アドバイザリー", color:"var(--area-d)",
      target:"税務関連3社を基本軸に",
      tiers:[
        { label:"基本軸（税務中心）", target:"3社", core:true, firms:[
          {id:"d-pwctax", name:"PwC税理士法人"},
          {id:"d-crefix", name:"クリフィックス税理士法人"},
          {id:"d-univis", name:"ユニヴィスグループ"},
        ]},
        { label:"その他（任意・時間があれば）", target:"", collapsedInto:true, firms:[
          {id:"d-pwcadv", name:"PwCアドバイザリー合同会社"},
          {id:"d-reiwa", name:"令和アカウンティング・ホールディングス(株)"},
          {id:"d-dtvs", name:"デロイト トーマツ ベンチャーサポート(株)"},
          {id:"d-sova", name:"(株)SoVa"},
          {id:"d-kpmgfas", name:"(株)KPMG FAS"},
          {id:"d-yamada", name:"山田コンサルティンググループ(株)"},
          {id:"d-dt-godo", name:"合同会社デロイト トーマツ"},
          {id:"d-dt-risk", name:"リスクアドバイザリー・合同会社デロイト トーマツ"},
          {id:"d-fa", name:"ファイナンシャルアドバイザリー"},
        ]}
      ]
    }
  ];

  const BENCHMARK = { name:"新宿監査法人（参考・本命）", staff:14, listed:10 };

  const COMMON_QUESTIONS = [
    { id:"q-shusa-timing", text:"主査を最短で任されるタイミングはいつか" },
    { id:"q-shusa-rate", text:"実際にその年次で任される人はどの程度の割合か" },
    { id:"q-tax-path", text:"税務業務に携われるか、どういったパスがあるか" },
  ];

  const AREA_QUESTIONS = {
    A: [
      { id:"qa-discretion", text:"若手にどれくらいの裁量が任されるか" },
      { id:"qa-assignment", text:"配属や専門分野はいつ決まるか" },
    ],
    B: [
      { id:"qb-workload", text:"一人当たり大法人と比べてどの程度業務を割り振られるか" },
      { id:"qb-discretion", text:"裁量はどの程度あるか" },
    ],
    C: [
      { id:"qc-diff", text:"大手との違いはどういった点か" },
    ],
    D: [
      { id:"qd-registration", text:"御法人での勤務で公認会計士登録はできるのか（実務要件を満たせるか）" },
    ],
  };

  const STATUS_KEY = "firm-status";
  let status = {}; // { [firmId]: {visited:bool, rating:0-5} }
  let pdfExists = new Set(); // firmIds that have a stored pdf
  let currentFilter = "all";

  function allFirms(){
    return AREAS.flatMap(a => a.tiers.flatMap(t => t.firms));
  }

  // ---------------- storage ----------------
  async function loadStatus(){
    try{
      const res = await window.storage.get(STATUS_KEY, false);
      status = res && res.value ? JSON.parse(res.value) : {};
    }catch(e){
      status = {};
    }
  }
  async function saveStatus(){
    try{
      await window.storage.set(STATUS_KEY, JSON.stringify(status), false);
    }catch(e){
      console.error("保存に失敗しました", e);
    }
  }
  async function loadPdfIndex(){
    try{
      const res = await window.storage.list("pdf:", false);
      if(res && res.keys){
        res.keys.forEach(k => pdfExists.add(k.replace(/^pdf:/, "")));
      }
    }catch(e){ /* no pdfs yet */ }
  }

  function getStatus(id){
    return status[id] || {visited:false, rating:0, memoPrep:"", memoDay:"", priority:"", qa:{}};
  }
  function escapeHtml(str){
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }
  function setStatus(id, patch){
    status[id] = Object.assign({}, getStatus(id), patch);
    saveStatus();
  }

  // ---------------- rendering ----------------
  function renderStats(){
    const row = document.getElementById("statsRow");
    const total = allFirms().length;
    const visited = allFirms().filter(f => getStatus(f.id).visited).length;
    let html = `<div class="stat-pill"><b>${visited}</b> / ${total} 法人 訪問済み</div>`;
    html += `<div class="stat-pill" style="border-color:var(--stamp-red);"><span class="area-dot" style="background:var(--stamp-red)"></span>${BENCHMARK.name}：常勤 <b>${BENCHMARK.staff}</b>名／上場監査 ${BENCHMARK.listed}社</div>`;
    AREAS.forEach(a=>{
      const firms = a.tiers.flatMap(t=>t.firms);
      const v = firms.filter(f=>getStatus(f.id).visited).length;
      html += `<div class="stat-pill"><span class="area-dot" style="background:${a.color}"></span>${a.id}エリア <b>${v}</b>/${firms.length}</div>`;
    });
    row.innerHTML = html;
  }

  function starRow(firmId, rating){
    let html = `<div class="stars" role="group" aria-label="評価">`;
    for(let i=1;i<=5;i++){
      html += `<button class="star-btn ${i<=rating?'filled':''}" data-firm="${firmId}" data-star="${i}" aria-label="${i}つ星">★</button>`;
    }
    html += `</div>`;
    return html;
  }

  function firmCard(firm, color, isCore, areaId){
    const st = getStatus(firm.id);
    const hasPdf = pdfExists.has(firm.id);
    const priorityFlag = st.priority ? `<span class="priority-flag ${st.priority}">${st.priority==='main'?'メイン':'余裕があれば'}</span>` : '';
    const questions = COMMON_QUESTIONS.concat(AREA_QUESTIONS[areaId] || []);
    const qaState = st.qa || {};
    const checkedCount = questions.filter(q => qaState[q.id]).length;
    const qaListHtml = questions.map(q => `
      <li>
        <label class="${qaState[q.id] ? 'checked-q':''}">
          <input type="checkbox" data-firm="${firm.id}" data-qid="${q.id}" ${qaState[q.id] ? 'checked' : ''}>
          ${q.text}
        </label>
      </li>`).join("");
    return `
    <div class="firm-card ${isCore?'core-tag':''}" style="--area-color:${color}" data-firm="${firm.id}" data-visited="${st.visited}" data-priority="${st.priority||''}">
      ${priorityFlag}
      <div>
        <p class="firm-name">${firm.name}</p>
        ${firm.staff ? `<p class="firm-meta">常勤 ${firm.staff.toLocaleString()}名／上場監査 ${firm.listed}社</p>` : ``}
        ${starRow(firm.id, st.rating)}
        <div class="priority-row">
          <button class="priority-btn ${st.priority==='main'?'active':''}" data-priority="main" data-firm="${firm.id}" type="button">メインで回る</button>
          <button class="priority-btn ${st.priority==='optional'?'active':''}" data-priority="optional" data-firm="${firm.id}" type="button">余裕があれば</button>
        </div>
        <div class="qa-zone">
          <p class="qa-label">質問チェックリスト <span class="qa-count" data-qa-count="${firm.id}">${checkedCount}/${questions.length}</span></p>
          <ul class="qa-list">${qaListHtml}</ul>
        </div>
        <div class="memo-zone">
          <label class="memo-label" for="memo-prep-${firm.id}">事前準備メモ（調べたこと・聞きたい質問）</label>
          <textarea class="memo-input" id="memo-prep-${firm.id}" data-firm="${firm.id}" data-memo-type="memoPrep" placeholder="優先度、下調べした内容、当日聞きたいことなど">${st.memoPrep ? escapeHtml(st.memoPrep) : ""}</textarea>
          <span class="memo-saved" data-firm-saved="${firm.id}-memoPrep">保存しました</span>
        </div>
        <div class="memo-zone">
          <label class="memo-label" for="memo-day-${firm.id}">当日メモ（聞いた話・印象）</label>
          <textarea class="memo-input" id="memo-day-${firm.id}" data-firm="${firm.id}" data-memo-type="memoDay" placeholder="実際に聞いた話、雰囲気、気になった点など">${st.memoDay ? escapeHtml(st.memoDay) : ""}</textarea>
          <span class="memo-saved" data-firm-saved="${firm.id}-memoDay">保存しました</span>
        </div>
        <div class="pdf-zone">
          ${hasPdf ? `
            <details class="pdf-attached" data-firm="${firm.id}">
              <summary>資料PDFを見る<button class="pdf-remove" data-firm="${firm.id}" type="button">削除</button></summary>
              <div class="pdf-frame-wrap"></div>
            </details>
          ` : `
            <label class="pdf-add-label">
              📎 資料PDFを追加
              <input type="file" accept="application/pdf" data-firm="${firm.id}">
            </label>
          `}
        </div>
      </div>
      <div class="stamp-zone">
        <button class="stamp-btn ${st.visited?'on':''}" data-firm="${firm.id}" aria-pressed="${st.visited}" aria-label="訪問済みにする">
          <span class="stamp-mark">済</span>
        </button>
        <span class="stamp-caption">${st.visited?'訪問済み':'未訪問'}</span>
      </div>
    </div>`;
  }

  function renderMain(){
    const main = document.getElementById("main");
    main.innerHTML = AREAS.map(area => {
      const tiersHtml = area.tiers.map(tier => {
        const cardsHtml = tier.firms.map(f => firmCard(f, area.color, tier.core, area.id)).join("");
        const body = `
          <div class="tier-label">${tier.label} ${tier.target ? `<span class="tier-target">目安：${tier.target}</span>`:''}</div>
          <div class="card-grid">${cardsHtml}</div>`;
        if(tier.collapsedInto){
          return `<details class="other-toggle"><summary>その他の法人（任意）を表示</summary>${body}</details>`;
        }
        return `<div class="tier-group">${body}</div>`;
      }).join("");

      const firms = area.tiers.flatMap(t=>t.firms);
      const v = firms.filter(f=>getStatus(f.id).visited).length;

      return `
      <section class="area-section" data-area="${area.id}">
        <div class="area-head" style="--area-color:${area.color}">
          <span class="area-letter">${area.id}</span>
          <div class="area-titles">
            <div class="area-name">${area.name}</div>
            <div class="area-target">${area.target}</div>
          </div>
          <div class="area-progress">${v} / ${firms.length}</div>
        </div>
        ${tiersHtml}
      </section>`;
    }).join("");

    applyFilter();
    bindCardEvents();
  }

  let currentPriorityFilter = "all";

  function applyFilter(){
    document.querySelectorAll(".firm-card").forEach(card=>{
      const visited = card.getAttribute("data-visited") === "true";
      const priority = card.getAttribute("data-priority") || "";
      let show = true;
      if(currentFilter === "unvisited") show = show && !visited;
      if(currentFilter === "visited") show = show && visited;
      if(currentPriorityFilter === "main") show = show && priority === "main";
      if(currentPriorityFilter === "optional") show = show && priority === "optional";
      card.classList.toggle("hidden-by-filter", !show);
    });
  }

  // ---------------- events ----------------
  function bindCardEvents(){
    // stamp toggle
    document.querySelectorAll(".stamp-btn").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const id = btn.dataset.firm;
        const st = getStatus(id);
        const newVisited = !st.visited;
        setStatus(id, {visited:newVisited});
        btn.classList.toggle("on", newVisited);
        btn.setAttribute("aria-pressed", newVisited);
        btn.closest(".firm-card").setAttribute("data-visited", newVisited);
        btn.parentElement.querySelector(".stamp-caption").textContent = newVisited ? "訪問済み" : "未訪問";
        renderStats();
        applyFilter();
      });
    });

    // stars
    document.querySelectorAll(".star-btn").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const id = btn.dataset.firm;
        const val = parseInt(btn.dataset.star, 10);
        const cur = getStatus(id).rating;
        const newVal = (cur === val) ? 0 : val; // click same star again to clear
        setStatus(id, {rating:newVal});
        const row = btn.parentElement;
        row.querySelectorAll(".star-btn").forEach(b=>{
          b.classList.toggle("filled", parseInt(b.dataset.star,10) <= newVal);
        });
      });
    });

    // question checklist
    document.querySelectorAll('.qa-list input[type="checkbox"]').forEach(cb=>{
      cb.addEventListener("change", ()=>{
        const id = cb.dataset.firm;
        const qid = cb.dataset.qid;
        const st = getStatus(id);
        const qa = Object.assign({}, st.qa || {});
        qa[qid] = cb.checked;
        setStatus(id, {qa});
        cb.closest("label").classList.toggle("checked-q", cb.checked);
        const countEl = document.querySelector(`[data-qa-count="${id}"]`);
        if(countEl){
          const total = countEl.closest(".qa-zone").querySelectorAll('input[type="checkbox"]').length;
          const checked = countEl.closest(".qa-zone").querySelectorAll('input[type="checkbox"]:checked').length;
          countEl.textContent = `${checked}/${total}`;
        }
      });
    });

    // priority toggle
    document.querySelectorAll(".priority-btn").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const id = btn.dataset.firm;
        const val = btn.dataset.priority;
        const cur = getStatus(id).priority;
        const newVal = (cur === val) ? "" : val;
        setStatus(id, {priority:newVal});
        const card = btn.closest(".firm-card");
        card.setAttribute("data-priority", newVal);
        card.querySelectorAll(".priority-btn").forEach(b=>{
          b.classList.toggle("active", b.dataset.priority === newVal && newVal !== "");
        });
        const existingFlag = card.querySelector(".priority-flag");
        if(existingFlag) existingFlag.remove();
        if(newVal){
          const flag = document.createElement("span");
          flag.className = "priority-flag " + newVal;
          flag.textContent = newVal === "main" ? "メイン" : "余裕があれば";
          card.insertBefore(flag, card.firstChild);
        }
        applyFilter();
      });
    });

    // memo (debounced save, two types: memoPrep / memoDay)
    document.querySelectorAll(".memo-input").forEach(area=>{
      let timer = null;
      area.addEventListener("input", ()=>{
        const id = area.dataset.firm;
        const type = area.dataset.memoType;
        clearTimeout(timer);
        timer = setTimeout(()=>{
          setStatus(id, {[type]: area.value});
          const indicator = document.querySelector(`.memo-saved[data-firm-saved="${id}-${type}"]`);
          if(indicator){
            indicator.classList.add("show");
            setTimeout(()=> indicator.classList.remove("show"), 1200);
          }
        }, 500);
      });
    });

    // pdf upload
    document.querySelectorAll('input[type="file"][data-firm]').forEach(input=>{
      input.addEventListener("change", async (e)=>{
        const id = input.dataset.firm;
        const file = e.target.files[0];
        if(!file) return;
        if(file.type !== "application/pdf"){
          alert("PDFファイルを選択してください。");
          input.value = "";
          return;
        }
        const label = input.closest(".pdf-add-label");
        const originalText = label.innerHTML;
        label.innerHTML = "読み込み中...";
        try{
          const dataUrl = await fileToDataUrl(file);
          const base64 = dataUrl.split(",")[1];
          const result = await window.storage.set("pdf:"+id, base64, false);
          if(!result){ throw new Error("保存に失敗しました"); }
          pdfExists.add(id);
          renderMain();
        }catch(err){
          console.error(err);
          label.innerHTML = originalText;
          const zone = input.closest(".pdf-zone");
          const errEl = document.createElement("div");
          errEl.className = "pdf-error";
          errEl.textContent = "PDFの保存に失敗しました。ファイルサイズが大きすぎる可能性があります。";
          zone.appendChild(errEl);
        }
      });
    });

    // pdf view (lazy load) + remove
    document.querySelectorAll(".pdf-attached").forEach(det=>{
      det.addEventListener("toggle", async ()=>{
        if(!det.open) return;
        const wrap = det.querySelector(".pdf-frame-wrap");
        if(wrap.dataset.loaded) return;
        wrap.innerHTML = `<div class="pdf-loading">資料を読み込み中...</div>`;
        const id = det.dataset.firm;
        try{
          const res = await window.storage.get("pdf:"+id, false);
          if(res && res.value){
            wrap.innerHTML = `<iframe src="data:application/pdf;base64,${res.value}"></iframe>`;
            wrap.dataset.loaded = "1";
          }else{
            wrap.innerHTML = `<div class="pdf-error">資料が見つかりませんでした。</div>`;
          }
        }catch(err){
          wrap.innerHTML = `<div class="pdf-error">資料の読み込みに失敗しました。</div>`;
        }
      });
    });

    document.querySelectorAll(".pdf-remove").forEach(btn=>{
      btn.addEventListener("click", async (e)=>{
        e.preventDefault();
        e.stopPropagation();
        const id = btn.dataset.firm;
        if(!confirm("この資料PDFを削除しますか？")) return;
        try{
          await window.storage.delete("pdf:"+id, false);
        }catch(err){ /* ignore */ }
        pdfExists.delete(id);
        renderMain();
      });
    });
  }

  function fileToDataUrl(file){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = ()=> resolve(reader.result);
      reader.onerror = ()=> reject(new Error("読み込み失敗"));
      reader.readAsDataURL(file);
    });
  }

  document.querySelectorAll(".filter-btn[data-filter]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      document.querySelectorAll(".filter-btn[data-filter]").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      currentFilter = btn.dataset.filter;
      applyFilter();
    });
  });

  document.querySelectorAll(".filter-btn[data-priority-filter]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      document.querySelectorAll(".filter-btn[data-priority-filter]").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      currentPriorityFilter = btn.dataset.priorityFilter;
      applyFilter();
    });
  });

  // ---------------- backup (export / import) ----------------
  function showBackupMsg(text, isError){
    const el = document.getElementById("backupMsg");
    el.textContent = text;
    el.classList.toggle("error", !!isError);
    if(!isError){
      setTimeout(()=>{ if(el.textContent === text) el.textContent = ""; }, 4000);
    }
  }

  async function exportBackup(){
    showBackupMsg("書き出し中...");
    try{
      const pdfs = {};
      for(const id of pdfExists){
        try{
          const res = await window.storage.get("pdf:"+id, false);
          if(res && res.value) pdfs[id] = res.value;
        }catch(e){ /* skip this pdf, continue */ }
      }
      const payload = {
        exportedAt: new Date().toISOString(),
        status: status,
        pdfs: pdfs
      };
      const blob = new Blob([JSON.stringify(payload)], {type:"application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const stamp = new Date().toISOString().slice(0,10);
      a.href = url;
      a.download = `kansa-houjin-checklist-backup-${stamp}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showBackupMsg("ダウンロードしました");
    }catch(e){
      console.error(e);
      showBackupMsg("書き出しに失敗しました", true);
    }
  }

  async function importBackup(file){
    showBackupMsg("復元中...");
    try{
      const text = await file.text();
      const payload = JSON.parse(text);
      if(!payload || typeof payload !== "object" || !payload.status){
        throw new Error("形式が正しくありません");
      }
      // merge status (imported values overwrite matching firm ids)
      status = Object.assign({}, status, payload.status);
      await saveStatus();
      // restore pdfs
      if(payload.pdfs){
        for(const id of Object.keys(payload.pdfs)){
          try{
            await window.storage.set("pdf:"+id, payload.pdfs[id], false);
            pdfExists.add(id);
          }catch(e){ /* skip this one, continue with others */ }
        }
      }
      renderStats();
      renderMain();
      showBackupMsg("復元しました");
    }catch(e){
      console.error(e);
      showBackupMsg("復元に失敗しました。ファイルを確認してください。", true);
    }
  }

  document.getElementById("exportBtn").addEventListener("click", exportBackup);
  document.getElementById("importInput").addEventListener("change", (e)=>{
    const file = e.target.files[0];
    if(file) importBackup(file);
    e.target.value = "";
  });

  // ---------------- init ----------------
  (async function init(){
    document.getElementById("main").innerHTML = `<p style="color:var(--ink-soft);font-size:13px;padding:20px 0;">読み込み中...</p>`;
    await loadStatus();
    await loadPdfIndex();
    renderStats();
    renderMain();
  })();

})();
</script>
</body>
</html>
